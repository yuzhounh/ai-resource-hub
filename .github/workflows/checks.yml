name: Account and expense checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    # Offline report tests import the Windows Credential Manager binding.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test_expenses_accounts.cjs
      - run: node test_expenses_sync.mjs
      - run: node --test test_view_subscriptions.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s api-connectivity -p 'test_*report.py'
      - run: python api-connectivity/verify_embedded_report.py
