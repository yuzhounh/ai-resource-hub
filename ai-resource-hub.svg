<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">AI Resource Hub</title>
  <desc id="desc">A central AI resource hub surrounded by three orbiting satellite resource nodes connected by rotational vortex curves.</desc>
  <defs>
    <linearGradient id="hubGradient" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7457e8"/>
      <stop offset="1" stop-color="#de4f82"/>
    </linearGradient>
    <linearGradient id="mintGradient" x1="6" y1="12" x2="15" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43a68f"/>
      <stop offset="1" stop-color="#16b997"/>
    </linearGradient>
    <linearGradient id="oceanGradient" x1="33" y1="12" x2="42" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#668dd8"/>
      <stop offset="1" stop-color="#397ce8"/>
    </linearGradient>
    <linearGradient id="amberGradient" x1="20" y1="35" x2="28" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d39448"/>
      <stop offset="1" stop-color="#e58a24"/>
    </linearGradient>
  </defs>
  <style>
    .link{fill:none;stroke:#668dd8;stroke-opacity:.65;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
    .hub{fill:url(#hubGradient)}
    .node-mint{fill:url(#mintGradient)}
    .node-ocean{fill:url(#oceanGradient)}
    .node-amber{fill:url(#amberGradient)}
    .detail{fill:#fff;fill-opacity:.94}
    @media(prefers-color-scheme:dark){.link{stroke-opacity:.8}.detail{fill-opacity:.88}}
  </style>
  <path class="link" d="M29.69 26.46 Q27.57 35.32 24.00 39.60"/>
  <path class="link" d="M19.02 27.70 Q12.41 21.43 10.49 16.20"/>
  <path class="link" d="M23.29 17.84 Q32.02 15.25 37.51 16.20"/>
  <circle class="hub" cx="24" cy="24" r="6.2"/>
  <path class="detail" d="M24 20.3c.28 2.05 1.45 3.18 3.5 3.46-2.05.28-3.22 1.41-3.5 3.46-.28-2.05-1.45-3.18-3.5-3.46 2.05-.28 3.22-1.41 3.5-3.46Z"/>
  <circle class="node-amber" cx="24.00" cy="39.60" r="4.0"/>
  <circle class="node-mint" cx="10.49" cy="16.20" r="4.0"/>
  <circle class="node-ocean" cx="37.51" cy="16.20" r="4.0"/>
  <circle class="detail" cx="24.00" cy="39.60" r="1.3"/>
  <circle class="detail" cx="10.49" cy="16.20" r="1.3"/>
  <circle class="detail" cx="37.51" cy="16.20" r="1.3"/>
</svg>
